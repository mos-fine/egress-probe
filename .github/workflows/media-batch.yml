name: media-batch
on:
  push:
    paths: ["media_batch.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 media_batch.py
      - name: push
        if: always()
        run: |
          git config user.name resolver
          git config user.email resolver@users.noreply.github.com
          git add -f media_batch.json
          git commit -m "media batch result" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main || true
