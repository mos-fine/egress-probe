name: egress-probe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - name: push result
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add -f result.md
          git commit -m "probe result" || true
          git push origin HEAD:main || true
