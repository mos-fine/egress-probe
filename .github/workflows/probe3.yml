name: probe3
on:
  push:
    paths: ["probe3.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe3.py
      - name: push
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add -f result3.md
          git commit -m "probe3 result" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main || true
