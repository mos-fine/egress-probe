name: probe2
on:
  push:
    branches: [main]
    paths: ["probe2.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe2.py
      - name: push
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add -f result2.md
          git commit -m "probe2 result" || true
          git push origin HEAD:main || true
