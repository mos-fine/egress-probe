name: enrich-overseas-seed
on:
  push:
    paths: ["scripts/enrich_overseas_seed.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/enrich_overseas_seed.py
      - name: commit seed
        if: always()
        run: |
          git config user.name overseas-bot
          git config user.email overseas-bot@users.noreply.github.com
          git add -f fastapi_backend/app/data/moboreels_catalog.json
          git commit -m "chore: enrich overseas seed" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main || true
