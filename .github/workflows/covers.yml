name: covers
on:
  push:
    paths: ["covers.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 covers.py
      - name: push
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add -f covers.json
          git commit -m "covers result" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main || true
