name: resolve-media
on:
  push:
    paths: ["resolve_media.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 resolve_media.py
      - name: push
        if: always()
        run: |
          git config user.name resolver
          git config user.email resolver@users.noreply.github.com
          git add -f media_urls.json
          git commit -m "resolve result" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main || true
