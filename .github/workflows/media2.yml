name: media2
on:
  push:
    paths: ["media2.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 media2.py
      - name: push
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add -f media2.json
          git commit -m "media2 result" || true
          git pull --rebase -q origin main || true
          git push origin HEAD:main || true
